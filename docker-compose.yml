name: meshlod

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-meshlod}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-17612}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-meshlod}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meshlod-backend:local
    container_name: ${COMPOSE_PROJECT_NAME:-meshlod}-backend
    restart: unless-stopped
    environment:
      ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      ARTIFACT_DIR: ${ARTIFACT_DIR}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      SEED_DEMO: ${SEED_DEMO}
    ports:
      - "${BACKEND_PORT:-19112}:8000"
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 150s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meshlod-backend:local
    container_name: ${COMPOSE_PROJECT_NAME:-meshlod}-worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app.celery_app", "worker", "-Q", "lod", "-c", "2", "--loglevel=info"]
    environment:
      ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      ARTIFACT_DIR: ${ARTIFACT_DIR}
      SEED_DEMO: "false"
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-meshlod}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18112}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  db_data:
  redis_data:
  artifact_data:
